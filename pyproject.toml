[project]
name = "autotests-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mypy>=2.4.0",
    "requests>=2.34.2",
    "ruff>=0.17.1",
]

[project.scripts]
autotests-python = "autotests_python:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
]

[tool.ruff.lint]
extend-select = ["I", "N", "UP", "B"]
